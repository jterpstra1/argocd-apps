apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
#  - ../../base/

patches:
  - target:
      kind: Application
    patch: |
      - op: replace
        path: /metadata/name
        value: stackweaver
      - op: replace
        path: /metadata/namespace
        value: public-apps
      - op: replace
        path: /metadata/labels/env
        value: vdgt-k3s
      - op: replace
        path: /spec/project
        value: public-apps
      - op: replace
        path: /spec/source/path
        value: argocd-k8s-resources/stackweaver-app/overlays/vdgt-k3s
      - op: replace
        path: /spec/source/targetRevision
        value: main
      - op: replace
        path: /spec/destination/namespace
        value: stackweaver